name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PANEL_REPO: MHSanaei/3x-ui
  PANEL_REF: v3.11.0
  XRAY_VER: v26.11.9

jobs:
  panel:
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout panel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PANEL_REPO }}
          ref: ${{ env.PANEL_REF }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch panel source (Chinese-only, no sponsor/branding/updater)
        run: |
          set -e
          # ---- A. Chinese-only UI ----
          cd internal/web/translation
          find . -maxdepth 1 -name '*.json' ! -name 'zh-CN.json' -delete
          cd ../../..

          python3 - <<'PYEOF'
          import re
          p = 'frontend/src/utils/index.ts'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r"static readonly supportedLanguages: readonly SupportedLanguage\[\] = \[.*?\];",
                     "static readonly supportedLanguages: readonly SupportedLanguage[] = [\n    { name: '简体中文', value: 'zh-CN', icon: '🇨🇳' },\n  ];", s, flags=re.S)
          s = re.sub(r"const simularLangs: \[string, string\]\[\] = \[.*?\];",
                     "const simularLangs: [string, string][] = [];", s, flags=re.S)
          assert "value: 'zh-CN'" in s and "simularLangs: [string, string][] = [];" in s, "language list patch failed"
          open(p, 'w', encoding='utf-8').write(s)
          PYEOF

          # ---- B. remove sponsors / branding / external links / in-panel updater ----
          python3 - <<'PYEOF'
          import re
          for path, name, props in [
            ('frontend/src/components/sponsor/SponsorSlot.tsx', 'SponsorSlot', 'SponsorSlotProps'),
            ('frontend/src/components/sponsor/SponsorCard.tsx', 'SponsorCard', 'SponsorCardProps'),
          ]:
              s = open(path, encoding='utf-8').read()
              m = re.search(r'export (?:interface|type) ' + props + r'.*?(?=\nexport default)', s, re.S)
              keep = m.group(0) if m else ''
              open(path, 'w', encoding='utf-8').write(
                  '/* xui-pox: sponsor components disabled */\n' + keep +
                  '\nexport default function ' + name + '(_props: ' + props + ') {\n  return null;\n}\n')
          PYEOF

          sed -i "/path: '\/sponsors'/d" frontend/src/routes/panelRoutes.tsx
          sed -i "s|const DONATE_URL = .*|const DONATE_URL = '#';|; s|const DOCS_URL = .*|const DOCS_URL = '#';|; s|const REPO_URL = .*|const REPO_URL = '#';|" frontend/src/layouts/AppSidebar.tsx
          sed -i "s|onClick={onOpenPanelUpdate}|onClick={() => {}}|; s|onClick={onOpenVersionSwitch}|onClick={() => {}}|" frontend/src/pages/index/OverviewActionBar.tsx
          sed -i 's|<span className="brand-name">3X-UI</span>|<span className="brand-name">xui-pox</span>|' frontend/src/pages/login/LoginPage.tsx
          sed -i "s|label: '3X-UI Panel API'|label: 'xui-pox Panel API'|" frontend/src/pages/api-docs/ApiDocsPage.tsx
          sed -i "s|issuer: '3x-ui'|issuer: 'xui-pox'|" frontend/src/pages/settings/TwoFactorModal.tsx
          sed -i 's|<span>3x-ui Command Palette</span>|<span>Command Palette</span>|' frontend/src/components/command-palette/CommandPalette.tsx
          sed -i "s|3x-ui-outbound-sub/1.0|xui-pox-outbound-sub/1.0|" frontend/src/pages/xray/outbounds/OutboundsTab.tsx
          sed -i 's|placeholder="3x-ui"|placeholder="xui-pox"|' frontend/src/pages/settings/EmailTab.tsx
          sed -i 's|href="https://github.com/MHSanaei/3x-ui/blob/main/docs/custom-subscription-templates.md"|href="#"|; s|/etc/3x-ui/sub_templates|/etc/x-ui/sub_templates|g' frontend/src/pages/settings/SubscriptionGeneralTab.tsx
          sed -i 's|<html lang="en">|<html lang="zh-CN">|' frontend/index.html
          sed -i 's|<meta charset="UTF-8" />|<meta charset="UTF-8" />\n    <title>xui-pox</title>|' frontend/index.html
          sed -i "s|{railCollapsed ? '3X' : '3X-UI'}|{railCollapsed ? 'xp' : 'xui-pox'}|" frontend/src/layouts/AppSidebar.tsx
          sed -i "s|name: '3x-ui'|name: 'xui-pox'|; s|title: '3X-UI Panel API'|title: 'xui-pox Panel API'|; s|a 3X-UI panel|a xui-pox panel|" frontend/scripts/build-openapi.mjs

          # catch-all: rebrand remaining occurrences in frontend sources
          grep -rl "3X-UI\|3x-ui" frontend/src frontend/scripts --include='*.ts' --include='*.tsx' --include='*.mjs' | xargs -r sed -i 's|3X-UI|xui-pox|g; s|3x-ui|xui-pox|g'
          grep -rl "MHSanaei" frontend/src frontend/scripts | xargs -r sed -i 's|github.com/MHSanaei/3x-ui|github.com/suanx/xui-pox|g; s|MHSanaei|suanx|g'

          # ---- C. Go side: mechanical module rebrand + user-visible strings ----
          grep -rl "github.com/mhsanaei/3x-ui/v3" --include='*.go' . | xargs -r sed -i 's|github.com/mhsanaei/3x-ui/v3|github.com/suanx/xui-pox/v3|g'
          sed -i 's|^module github.com/mhsanaei/3x-ui/v3|module github.com/suanx/xui-pox/v3|' go.mod
          sed -i 's|"https://raw.githubusercontent.com/MHSanaei/3x-ui/main/update.sh"|""|' internal/web/service/panel/panel.go
          sed -i 's|https://api.github.com/repos/MHSanaei/3x-ui/releases|https://api.github.com/repos/suanx/xui-pox/releases|g' internal/web/service/panel/panel.go
          sed -i 's|"https://raw.githubusercontent.com/MHSanaei/sponsors/refs/heads/main/3X/sponsors.json"|""|; s|"https://raw.githubusercontent.com/MHSanaei/sponsors/refs/heads/main/3X/logos/"|""|' internal/web/service/panel/sponsor.go
          sed -i 's|MHSanaei/3x-ui#6535|xui-pox|' internal/util/totp/totp.go
          GOFILES=$(grep -rl "3x-ui" --include='*.go' . || true)
          [ -n "$GOFILES" ] && xargs -r sed -i 's|3x-ui-test-log|xui-pox-test-log|g; s|not a 3x-ui panel database|not a xui-pox panel database|g; s|3x-ui panel|xui-pox panel|g; s|3x-ui application|xui-pox application|g' <<< "$GOFILES" || true
          echo "go-side rebrand done:" && grep -rn "mhsanaei" --include='*.go' . | head -5 || echo "no mhsanaei left in go sources"

          python3 - <<'PYEOF'
          import json
          p = 'internal/web/translation/zh-CN.json'
          d = json.load(open(p, encoding='utf-8'))
          d.get('menu', {}).pop('sponsors', None)
          d.get('pages', {}).pop('sponsors', None)
          def repl(o):
              if isinstance(o, dict):
                  for k, v in o.items(): o[k] = repl(v)
                  return o
              if isinstance(o, list):
                  return [repl(v) for v in o]
              if isinstance(o, str):
                  return o.replace('3X-UI', 'xui-pox').replace('3x-ui', 'xui-pox')
              return o
          d = repl(d)
          json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PYEOF
          cp internal/web/translation/zh-CN.json internal/web/translation/en-US.json
          echo "patch done:"
          ls internal/web/translation/
          grep -c "MHSanaei" frontend/src -r || echo "no author refs left in frontend"

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build panel binary (musl static)
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64";  export GOARCH=amd64 ;;
            arm64) BOOTLIN_ARCH="aarch64"; export GOARCH=arm64 ;;
          esac
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_URL=$(curl -fsSL --retry 5 "${TARBALL_BASE}" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate musl toolchain" >&2; exit 1; }
          cd /tmp
          curl -fsSL --retry 5 -o tc.tar.xz "${TARBALL_BASE}/${TARBALL_URL}"
          tar -xf tc.tar.xz
          TOOLCHAIN_DIR=$(find /tmp -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found" >&2; exit 1; }
          cd -
          go build -buildvcs=true -ldflags "-w -s -linkmode external -extldflags '-static'" -o x-ui-bin -v .
          file x-ui-bin

      - name: Assemble package
        run: |
          mkdir -p x-ui/bin
          cp x-ui-bin x-ui/x-ui
          cp x-ui.service.debian x-ui/x-ui.service
          chmod +x x-ui/x-ui
          cd x-ui/bin
          case "${{ matrix.platform }}" in
            amd64) XRAY_ZIP="Xray-linux-64.zip" ;;
            arm64) XRAY_ZIP="Xray-linux-arm64-v8a.zip" ;;
          esac
          curl -fsSL --retry 5 -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/${XRAY_ZIP}"
          unzip -o xray.zip
          rm -f xray.zip
          mv xray xray-linux-${{ matrix.platform }}
          chmod +x xray-linux-${{ matrix.platform }}
          rm -f geoip.dat geosite.dat
          curl -fsSL --retry 5 -o geoip.dat  https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL --retry 5 -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          cd ../..
          tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          ls -lh x-ui-linux-${{ matrix.platform }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: x-ui-linux-${{ matrix.platform }}.tar.gz

  warp:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch warp-plus binaries
        run: |
          curl -fsSL --retry 5 -o wp-amd64.zip https://github.com/bepass-org/warp-plus/releases/latest/download/warp-plus_linux-amd64.zip
          curl -fsSL --retry 5 -o wp-arm64.zip https://github.com/bepass-org/warp-plus/releases/latest/download/warp-plus_linux-arm64.zip
          unzip -o wp-amd64.zip -d wp-amd64
          unzip -o wp-arm64.zip -d wp-arm64
          mv wp-amd64/warp-plus xuiwpph_amd64
          mv wp-arm64/warp-plus xuiwpph_arm64
          chmod +x xuiwpph_amd64 xuiwpph_arm64
          ls -lh xuiwpph_*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-warp
          path: xuiwpph_*

  release:
    needs: [panel, warp]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          ls -lh
          TAG="latest"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "xui-pox auto build" \
              --notes "Automated build from source. Assets: 3x-ui panel packages compiled from source (amd64/arm64) with official Xray-core, and warp-plus binaries (amd64/arm64)." \
              --latest
          fi
          gh release upload "$TAG" \
            x-ui-linux-amd64.tar.gz x-ui-linux-arm64.tar.gz \
            xuiwpph_amd64 xuiwpph_arm64 \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
